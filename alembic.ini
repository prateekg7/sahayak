[alembic]
script_location = migrations
prepend_sys_path = .:src
path_separator = os
version_locations = %(here)s/migrations/versions/core:%(here)s/src/sahayak/modules/academics/migrations:%(here)s/src/sahayak/modules/productivity/migrations:%(here)s/src/sahayak/modules/finance/migrations:%(here)s/src/sahayak/modules/health/migrations:%(here)s/src/sahayak/modules/career/migrations:%(here)s/src/sahayak/modules/home/migrations:%(here)s/src/sahayak/modules/business/migrations:%(here)s/src/sahayak/modules/language/migrations

sqlalchemy.url = postgresql+asyncpg://sahayak:sahayak@localhost:5432/sahayak

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
