[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sahayak"
version = "0.0.0"
description = "A modular, stateless MCP server for the Sahayak voice assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sahayak contributors" }]
dependencies = [
  "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "import-linter>=2.3,<3",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sahayak"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=sahayak --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sahayak"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[tool.importlinter]
root_package = "sahayak"
