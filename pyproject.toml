[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sahayak"
version = "0.0.0"
description = "A modular, stateless MCP server for the Sahayak voice assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sahayak contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.3.0,<3",
  "prometheus-client>=0.20,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.8,<3",
  "python-ulid>=3,<4",
  "rapidfuzz>=3.9,<4",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.1,<26",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "fakeredis>=2.26,<3",
  "hypothesis>=6.100,<7",
  "import-linter>=2.3,<3",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6.1,<7",
  "respx>=0.22,<1",
  "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sahayak"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=sahayak --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "integration: requires a real service",
  "live: opt-in real network/provider tests",
]

[tool.coverage.run]
branch = true
source = ["sahayak"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*", "rapidfuzz", "rapidfuzz.*", "hypothesis", "hypothesis.*", "locust"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.importlinter]
root_package = "sahayak"

[[tool.importlinter.contracts]]
name = "Core does not import modules"
type = "forbidden"
source_modules = ["sahayak.core"]
forbidden_modules = ["sahayak.modules"]

[[tool.importlinter.contracts]]
name = "Domain does not import adapters"
type = "forbidden"
source_modules = ["sahayak.modules._template.domain"]
forbidden_modules = ["sahayak.modules._template.adapters"]

[[tool.importlinter.contracts]]
name = "Modules are independent"
type = "independence"
modules = ["sahayak.modules._template"]
