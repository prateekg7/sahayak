name: Alexa Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for add-on redeployment"
        required: true
        default: "Manual redeploy of Alexa+ add-on manifest"

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate Tool Surface and Deploy Add-on
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Verify tool snapshot integrity
        run: make snapshot-check

      - name: Deploy Alexa+ Add-on via CLI
        run: |
          echo "Deploying Alexa+ Add-on manifest with alexa-ai CLI..."
          echo "Reason: ${{ github.event.inputs.reason }}"
          # Requires human approval / alexa-ai credentials in production
