name: CI

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: sahayak
          POSTGRES_USER: sahayak
          POSTGRES_PASSWORD: sahayak
        options: >-
          --health-cmd "pg_isready --username=sahayak --dbname=sahayak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-bookworm
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://sahayak:sahayak@localhost:5432/sahayak
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: make test

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run bandit --quiet --recursive src
      - run: uv run pip-audit
      - name: Scan tracked files for secrets
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks:v8.27.2
          detect --source=/repo --no-git --redact

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build production image
        run: docker build --tag sahayak:ci .
      - name: Verify non-root runtime user
        run: test "$(docker run --rm --entrypoint id sahayak:ci -u)" = "10001"
      - name: Start the local compose topology
        run: docker compose up --build --wait
      - name: Review production image size
        run: docker image inspect sahayak:ci --format 'sahayak:ci size={{.Size}} bytes'
      - name: Scan production image
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed sahayak:ci
      - name: Stop local compose topology
        if: always()
        run: docker compose down --volumes --remove-orphans
