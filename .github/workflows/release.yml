name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --tag sahayak:${{ steps.vars.outputs.sha_short }} \
            --tag sahayak:latest .

      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

  migrate:
    name: Run Database Migrations (Expand-Only)
    needs: [build-and-push]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Run expand-only migrations
        env:
          TARGET_DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$TARGET_DB_URL" ]; then
            echo "Running expand-only migrations with sahayak_migrator role against remote database..."
            DATABASE_URL="$TARGET_DB_URL" PYTHONPATH=src uv run alembic upgrade heads
          else
            echo "DATABASE_URL secret is not set. Validating offline expand-only migration generation..."
            make migrate-check
          fi

  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push, migrate]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen --all-groups
      - name: Staging Rolling Deploy & Verification
        run: |
          if [ -n "${{ secrets.STAGING_URL }}" ]; then
            echo "Deploying image ${{ needs.build-and-push.outputs.image_tag }} to staging..."
            python scripts/smoke_test.py --url "${{ secrets.STAGING_URL }}" --iterations 5
          else
            echo "STAGING_URL secret not set. Skipping remote staging deployment."
          fi

  deploy-prod:
    name: Deploy to Production (Rolling with Auto-Rollback)
    needs: [deploy-staging]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen --all-groups
      - name: Production Rolling Deploy
        run: |
          echo "Deploying image ${{ needs.build-and-push.outputs.image_tag }} to production..."
      - name: Post-Deploy Smoke Test & Auto-Rollback
        run: |
          if [ "${{ secrets.PROD_URL }}" != "" ]; then
            python scripts/smoke_test.py --url "${{ secrets.PROD_URL }}" --iterations 10 || {
              echo "Smoke test failed! Triggering automatic rollback to previous active task revision..."
              python scripts/rollback.py --cluster sahayak-prod-cluster --service sahayak-prod-app
              exit 1
            }
          fi
