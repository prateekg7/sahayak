services:
  app:
    build:
      context: .
      target: runtime
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-Sahayak}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-full}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sahayak:sahayak@postgres:5432/sahayak}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENABLED_MODULES: ${ENABLED_MODULES:-academics}
    command: ["uvicorn", "sahayak.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      target: runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-full}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sahayak:sahayak@postgres:5432/sahayak}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENABLED_MODULES: ${ENABLED_MODULES:-academics}
    command: ["python", "-m", "sahayak.container", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=sahayak --dbname=sahayak"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
